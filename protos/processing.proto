syntax = "proto3";

message OrderRequest {
  uint32 recipeId = 1;
  uint32 orderId = 2;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  NEW = 1;
  QUEUED = 2;
  PROCESSING = 3;
  DONE = 4;
}

message OrderStatusUpdate {
  OrderStatus status = 1;
}

service Processing {
  rpc Process (OrderRequest) returns (stream OrderStatusUpdate) {}
}
